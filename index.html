<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tanawich | Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="index.html" class="logo">
            T<span>.</span>
        </a>

        <nav class="nav-menu">

            <a href="index.html" class="active">
                หน้าแรก
            </a>

            <a href="personal.html">
                ข้อมูลส่วนตัว
            </a>

            <a href="portfolio.html">
                แฟ้มสะสมผลงาน
            </a>

        </nav>

        <button class="menu-button">
            ☰
        </button>

    </header>


    <!-- ================= HOME ================= -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <!-- รูปโปรไฟล์ -->

                <div class="profile-container">

                    <img
                        src="images/profile.jpg"
                        alt="นายธนวิชญ์ ขจรกิดาการ"
                        class="profile-image"
                    >

                </div>


                <p class="small-title">
                    MY PORTFOLIO
                </p>


                <h1>
                    สวัสดีครับ ผม
                    <br>

                    <strong>
                        นาย ธนวิชญ์ ขจรกิดาการ
                    </strong>
                </h1>


                <div class="student-info">

                    <p>
                        แผนการเรียน: วิทยาการคอมพิวเตอร์และวิศวกรรม (CSE)
                    </p>

                    <p>
                        ชั้นมัธยมศึกษาปีที่ 6
                    </p>

                </div>


                <!-- ปุ่ม -->

                <div class="hero-buttons">

                    <a
                        href="portfolio.html"
                        class="main-button black-button"
                    >
                        แฟ้มสะสมผลงาน
                        <span>↗</span>
                    </a>


                    <a
                        href="personal.html"
                        class="main-button white-button"
                    >
                        ข้อมูลส่วนตัว
                        <span>↗</span>
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 Tanawich Kajornkidakan

    </footer>


    <!-- ================= SCRIPT ================= -->

    <script>

        const menuButton =
            document.querySelector(".menu-button");

        const navMenu =
            document.querySelector(".nav-menu");


        menuButton.addEventListener("click", function () {

            navMenu.classList.toggle("show");

        });


        document
            .querySelectorAll(".nav-menu a")
            .forEach(function(link) {

                link.addEventListener("click", function() {

                    navMenu.classList.remove("show");

                });

            });

    </script>

</body>

</html>
